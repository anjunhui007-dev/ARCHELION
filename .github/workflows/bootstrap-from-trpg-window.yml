name: Bootstrap from trpg-window

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-from-trpg-window.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ARCHELION
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source project
        run: git clone --depth 1 https://github.com/anjunhui007-dev/trpg-window.git /tmp/trpg-window

      - name: Copy source files
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows/bootstrap-from-trpg-window.yml' \
            /tmp/trpg-window/ ./

      - name: Commit cloned project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to copy"
          else
            git commit -m "Clone trpg-window as ARCHELION starting point"
            git push
          fi
